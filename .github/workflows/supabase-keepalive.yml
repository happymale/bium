name: Supabase 깨우기

# 무료 Supabase 프로젝트는 1주일 동안 API 요청이 없으면 자동 정지됩니다.
# 발표가 몇 주 뒤라면 그날 앱이 죽어 있게 됩니다.
# 사흘에 한 번 가벼운 요청을 보내 살아 있게 유지합니다.
on:
  schedule:
    - cron: '0 3 */3 * *' # 사흘마다 03:00 UTC (한국시간 정오)
  workflow_dispatch: # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: items 테이블에 최소 요청 보내기
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_KEY 시크릿이 없습니다. 건너뜁니다."
            exit 0
          fi
          # RLS 때문에 익명 요청은 0건을 돌려주지만, 요청 자체로 프로젝트는 깨어납니다.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$URL/rest/v1/items?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          # 200(빈 배열) 또는 401/403(RLS 차단) 모두 "프로젝트가 살아있음" 을 뜻합니다.
          case "$code" in
            200|401|403) echo "프로젝트 정상" ;;
            *) echo "예상치 못한 응답 — 프로젝트 상태를 확인하세요"; exit 1 ;;
          esac
